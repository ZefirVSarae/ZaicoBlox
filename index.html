<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SVG Platformer Maker</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1e1e24;
            color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }
        #toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px;
            background: #2b2b36;
            width: 100%;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 10;
        }
        .tool-btn {
            background: #3a3a48;
            border: 2px solid transparent;
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
        }
        .tool-btn:hover {
            background: #4d4d5e;
        }
        .tool-btn.active {
            border-color: #00ff88;
            background: #254235;
        }
        .mode-btn {
            background: #007bff;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-left: 10px;
            font-size: 14px;
        }
        .mode-btn:hover {
            background: #0056b3;
        }
        .mode-btn.play {
            background: #ff0055;
        }
        .mode-btn.play:hover {
            background: #cc0044;
        }
        #game-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            overflow: hidden;
            background: #121216;
            position: relative;
        }
        svg {
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
        svg.playing {
            cursor: default;
        }
        svg.panning {
            cursor: grab;
        }
        svg.panning:active {
            cursor: grabbing;
        }
        #mobile-controls {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: none;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 20;
            pointer-events: none;
        }
        #mobile-controls.active {
            display: flex;
        }
        .controls-group {
            display: flex;
            gap: 15px;
        }
        .m-btn {
            pointer-events: auto;
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: white;
            backdrop-filter: blur(4px);
        }
        .m-btn:active {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <div id="toolbar">
        <button class="tool-btn active" data-tool="grass">Трава</button>
        <button class="tool-btn" data-tool="dirt">Земля</button>
        <button class="tool-btn" data-tool="spike">Шипы</button>
        <button class="tool-btn" data-tool="spawn">Старт</button>
        <button class="tool-btn" data-tool="eraser">Ластик</button>
        <button class="tool-btn" data-tool="camera">Камера</button>
        <button id="modeBtn" class="mode-btn">Играть</button>
    </div>

    <div id="game-container">
        <svg id="gameCanvas" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice"></svg>
        
        <div id="mobile-controls">
            <div class="controls-group">
                <div class="m-btn" id="btn-left">◀</div>
                <div class="m-btn" id="btn-right">▶</div>
            </div>
            <div class="controls-group">
                <div class="m-btn" id="btn-jump">▲</div>
            </div>
        </div>
    </div>

    <script>
        const svgNS = "http://www.w3.org/2000/svg";
        const svgCanvas = document.getElementById('gameCanvas');
        const modeBtn = document.getElementById('modeBtn');
        const toolBtns = document.querySelectorAll('.tool-btn');
        const mobileControls = document.getElementById('mobile-controls');
        
        const TILE_SIZE = 40;
        const COLS = 150;
        const ROWS = 75;
        const VIEW_W = 1000;
        const VIEW_H = 600;
        
        let levelData = {};
        let currentTool = 'grass';
        let isEditMode = true;
        let isDrawing = false;
        let isPanning = false;
        
        let camX = 0;
        let camY = 0;
        let lastMouseX = 0;
        let lastMouseY = 0;

        let spawnPoint = { x: 120, y: 360 }; // Сместили дефолтный спавн ближе к земле
        
        const player = {
            x: 120, y: 360,
            width: 40, height: 80,
            vx: 0, vy: 0,
            speed: 6, jumpPower: -14, gravity: 0.6, friction: 0.8,
            element: null,
            grounded: false,
            facing: 1
        };

        const keys = {
            ArrowLeft: false, ArrowRight: false, ArrowUp: false,
            a: false, d: false, w: false, 'ф': false, 'в': false, 'ц': false
        };

        let gameLoopId;

        const tileDefs = {
            grass: `<rect x="0" y="0" width="40" height="40" fill="#8B4513" rx="4"/><path d="M 4 0 L 36 0 Q 40 0 40 4 L 40 12 L 0 12 L 0 4 Q 0 0 4 0 Z" fill="#2ed853"/>`,
            dirt: `<rect x="0" y="0" width="40" height="40" fill="#8B4513" rx="4"/><circle cx="10" cy="10" r="2" fill="#7a3c10"/><circle cx="30" cy="25" r="3" fill="#7a3c10"/><circle cx="15" cy="30" r="2" fill="#7a3c10"/>`,
            spike: `<rect x="0" y="20" width="40" height="20" fill="#2b2b2b" rx="2"/><path d="M5 20 L12 2 L19 20 M21 20 L28 2 L35 20" stroke="#e0e0e0" stroke-width="2" fill="#a0a0a0" stroke-linejoin="round"/>`
        };

        const gridGroup = document.createElementNS(svgNS, "g");
        const tilesGroup = document.createElementNS(svgNS, "g");
        const entitiesGroup = document.createElementNS(svgNS, "g");
        svgCanvas.appendChild(gridGroup);
        svgCanvas.appendChild(tilesGroup);
        svgCanvas.appendChild(entitiesGroup);

        // Улучшенная визуализация точки спавна
        const spawnElement = document.createElementNS(svgNS, "g");
        spawnElement.innerHTML = `
            <rect x="0" y="0" width="40" height="40" fill="rgba(0, 255, 128, 0.4)" stroke="#00ff88" stroke-width="3" stroke-dasharray="4"/>
            <text x="20" y="25" fill="#fff" font-size="16" text-anchor="middle" font-weight="bold" pointer-events="none">P</text>
        `;
        entitiesGroup.appendChild(spawnElement);
        updateSpawnVisual();

        // Создаем игрока через группу
        player.element = document.createElementNS(svgNS, "g");
        
        // Картинка персонажа
        const playerImg = document.createElementNS(svgNS, "image");
        playerImg.setAttributeNS("http://www.w3.org/1999/xlink", "href", "https://www.dropbox.com/scl/fi/me1gt4akn3aj2xw39rehx/160_20260713170653.png?rlkey=u4teia4gdnnby27noydlaan2g&st=s2grlxco&dl=1");
        playerImg.setAttribute("href", "https://www.dropbox.com/scl/fi/me1gt4akn3aj2xw39rehx/160_20260713170653.png?rlkey=u4teia4gdnnby27noydlaan2g&st=s2grlxco&dl=1");
        // Центрируем текстуру 80x80 относительно хитбокса 40x80
        playerImg.setAttribute("x", "-20");
        playerImg.setAttribute("width", "80");
        playerImg.setAttribute("height", "80");
        player.element.appendChild(playerImg);

        player.element.style.display = "none";
        entitiesGroup.appendChild(player.element);

        function initGrid() {
            for (let i = 0; i <= COLS; i++) {
                let line = document.createElementNS(svgNS, "line");
                line.setAttribute("x1", i * TILE_SIZE);
                line.setAttribute("y1", 0);
                line.setAttribute("x2", i * TILE_SIZE);
                line.setAttribute("y2", ROWS * TILE_SIZE);
                line.setAttribute("stroke", "rgba(255,255,255,0.2)");
                gridGroup.appendChild(line);
            }
            for (let i = 0; i <= ROWS; i++) {
                let line = document.createElementNS(svgNS, "line");
                line.setAttribute("x1", 0);
                line.setAttribute("y1", i * TILE_SIZE);
                line.setAttribute("x2", COLS * TILE_SIZE);
                line.setAttribute("y2", i * TILE_SIZE);
                line.setAttribute("stroke", "rgba(255,255,255,0.2)");
                gridGroup.appendChild(line);
            }
        }

        toolBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                toolBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTool = btn.dataset.tool;
                if(currentTool === 'camera') {
                    svgCanvas.classList.add('panning');
                } else {
                    svgCanvas.classList.remove('panning');
                }
            });
        });

        // ИСПРАВЛЕНО: точный расчет координат с помощью матрицы трансформации SVG
        function getRealCoords(evt) {
            let clientX = evt.clientX;
            let clientY = evt.clientY;
            
            if (evt.touches && evt.touches.length > 0) {
                clientX = evt.touches[0].clientX;
                clientY = evt.touches[0].clientY;
            } else if (evt.changedTouches && evt.changedTouches.length > 0) {
                clientX = evt.changedTouches[0].clientX;
                clientY = evt.changedTouches[0].clientY;
            }

            // Создаем точку SVG для идеальной трансформации
            const pt = svgCanvas.createSVGPoint();
            pt.x = clientX;
            pt.y = clientY;
            
            // Получаем координаты внутри игрового мира независимо от зума и обрезки экрана
            let svgP = { x: 0, y: 0 };
            const ctm = svgCanvas.getScreenCTM();
            if (ctm) {
                svgP = pt.matrixTransform(ctm.inverse());
            }

            return {
                x: svgP.x,
                y: svgP.y,
                rawX: clientX,
                rawY: clientY
            };
        }

        function updateCameraView() {
            camX = Math.max(0, Math.min(camX, COLS * TILE_SIZE - VIEW_W));
            camY = Math.max(0, Math.min(camY, ROWS * TILE_SIZE - VIEW_H));
            svgCanvas.setAttribute("viewBox", `${camX} ${camY} ${VIEW_W} ${VIEW_H}`);
        }

        function interact(evt) {
            if (!isEditMode) return;
            const coords = getRealCoords(evt);
            
            if (currentTool === 'camera') {
                if (isPanning) {
                    const rect = svgCanvas.getBoundingClientRect();
                    // Масштаб для камеры тоже пересчитываем честно
                    const scale = Math.max(VIEW_W / rect.width, VIEW_H / rect.height);
                    
                    camX -= (coords.rawX - lastMouseX) * scale;
                    camY -= (coords.rawY - lastMouseY) * scale;
                    updateCameraView();
                    
                    lastMouseX = coords.rawX;
                    lastMouseY = coords.rawY;
                }
                return;
            }

            const col = Math.floor(coords.x / TILE_SIZE);
            const row = Math.floor(coords.y / TILE_SIZE);
            const key = `${col},${row}`;

            // Защита от установки блоков за пределами мира
            if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return;

            if (currentTool === 'spawn') {
                spawnPoint.x = col * TILE_SIZE;
                spawnPoint.y = row * TILE_SIZE;
                updateSpawnVisual();
                return;
            }

            if (currentTool === 'eraser') {
                if (levelData[key]) {
                    tilesGroup.removeChild(levelData[key].element);
                    delete levelData[key];
                }
            } else {
                if (!levelData[key] || levelData[key].type !== currentTool) {
                    if (levelData[key]) {
                        tilesGroup.removeChild(levelData[key].element);
                    }
                    const g = document.createElementNS(svgNS, "g");
                    g.setAttribute("transform", `translate(${col * TILE_SIZE}, ${row * TILE_SIZE})`);
                    g.innerHTML = tileDefs[currentTool];
                    tilesGroup.appendChild(g);
                    
                    levelData[key] = {
                        type: currentTool,
                        x: col * TILE_SIZE,
                        y: row * TILE_SIZE,
                        element: g
                    };
                }
            }
        }

        function updateSpawnVisual() {
            spawnElement.setAttribute("transform", `translate(${spawnPoint.x}, ${spawnPoint.y})`);
        }

        function handlePointerDown(e) {
            if (e.target.closest('#mobile-controls') || e.target.closest('#toolbar')) return;
            const coords = getRealCoords(e);
            if (currentTool === 'camera') {
                isPanning = true;
                lastMouseX = coords.rawX;
                lastMouseY = coords.rawY;
            } else {
                isDrawing = true;
                interact(e);
            }
        }

        function handlePointerMove(e) {
            if (isDrawing || isPanning) {
                interact(e);
            }
        }

        function handlePointerUp() {
            isDrawing = false;
            isPanning = false;
        }

        svgCanvas.addEventListener('mousedown', handlePointerDown);
        window.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);

        svgCanvas.addEventListener('touchstart', (e) => {
            if (isEditMode && !e.target.closest('#toolbar')) e.preventDefault();
            handlePointerDown(e);
        }, { passive: false });
        
        window.addEventListener('touchmove', (e) => {
            if ((isDrawing || isPanning) && isEditMode) e.preventDefault();
            handlePointerMove(e);
        }, { passive: false });
        
        window.addEventListener('touchend', handlePointerUp);

        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
        });
        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
        });

        const handleMobileControls = (e) => {
            if (isEditMode) return;
            keys.ArrowLeft = false;
            keys.ArrowRight = false;
            keys.ArrowUp = false;

            for (let i = 0; i < e.touches.length; i++) {
                const touch = e.touches[i];
                const target = document.elementFromPoint(touch.clientX, touch.clientY);
                if (!target) continue;
                
                const id = target.id;
                if (id === 'btn-left' || target.closest('#btn-left')) keys.ArrowLeft = true;
                if (id === 'btn-right' || target.closest('#btn-right')) keys.ArrowRight = true;
                if (id === 'btn-jump' || target.closest('#btn-jump')) keys.ArrowUp = true;
            }
        };

        mobileControls.addEventListener('touchstart', (e) => { e.preventDefault(); handleMobileControls(e); }, { passive: false });
        mobileControls.addEventListener('touchmove', (e) => { e.preventDefault(); handleMobileControls(e); }, { passive: false });
        mobileControls.addEventListener('touchend', (e) => { e.preventDefault(); handleMobileControls(e); }, { passive: false });
        mobileControls.addEventListener('touchcancel', (e) => { e.preventDefault(); handleMobileControls(e); }, { passive: false });

        modeBtn.addEventListener('click', () => {
            isEditMode = !isEditMode;
            if (isEditMode) {
                modeBtn.textContent = "Играть";
                modeBtn.classList.remove('play');
                svgCanvas.classList.remove('playing');
                if(currentTool === 'camera') svgCanvas.classList.add('panning');
                gridGroup.style.display = "block";
                spawnElement.style.display = "block";
                player.element.style.display = "none";
                mobileControls.classList.remove('active');
                cancelAnimationFrame(gameLoopId);
            } else {
                modeBtn.textContent = "Редактор";
                modeBtn.classList.add('play');
                svgCanvas.classList.add('playing');
                svgCanvas.classList.remove('panning');
                gridGroup.style.display = "none";
                spawnElement.style.display = "none";
                player.element.style.display = "block";
                
                if (window.matchMedia("(max-width: 768px)").matches || 'ontouchstart' in window) {
                    mobileControls.classList.add('active');
                }
                
                resetPlayer();
                gameLoop();
            }
        });

        function resetPlayer() {
            // Центрируем 80x80 игрока на 40x40 спавн блоке
            player.x = spawnPoint.x + (TILE_SIZE - player.width) / 2;
            player.y = spawnPoint.y + (TILE_SIZE - player.height) / 2;
            player.vx = 0;
            player.vy = 0;
            updatePlayerVisual();
        }

        // ИСПРАВЛЕНО: безопасное отзеркаливание SVG без конфликта CSS
        function updatePlayerVisual() {
            if (player.vx < -0.1) player.facing = -1;
            else if (player.vx > 0.1) player.facing = 1;
            
            // Используем нативный SVG transform для поворота, чтобы не сбоило
            player.element.setAttribute("transform", 
                `translate(${player.x}, ${player.y}) 
                 translate(${player.width/2}, 0) 
                 scale(${player.facing}, 1) 
                 translate(${-player.width/2}, 0)`
            );
        }

        function getAABB(x, y, w, h) {
            return { left: x, right: x + w, top: y, bottom: y + h };
        }

        function checkCollision(r1, r2) {
            return r1.left < r2.right && r1.right > r2.left && r1.top < r2.bottom && r1.bottom > r2.top;
        }

        function gameLoop() {
            if (isEditMode) return;

            if (keys.ArrowLeft || keys.a || keys['ф']) player.vx -= 1;
            if (keys.ArrowRight || keys.d || keys['в']) player.vx += 1;
            
            player.vx *= player.friction;
            if (Math.abs(player.vx) > player.speed) player.vx = Math.sign(player.vx) * player.speed;

            if ((keys.ArrowUp || keys.w || keys['ц']) && player.grounded) {
                player.vy = player.jumpPower;
                player.grounded = false;
            }

            player.vy += player.gravity;
            
            // Ограничение максимальной скорости падения (чтобы не пролетать сквозь пол)
            if (player.vy > 25) player.vy = 25; 

            player.x += player.vx;
            handleCollisions('x');

            player.y += player.vy;
            player.grounded = false;
            handleCollisions('y');

            if (player.y > ROWS * TILE_SIZE + 200) {
                resetPlayer();
            }

            updatePlayerVisual();

            camX = player.x - VIEW_W / 2 + player.width / 2;
            camY = player.y - VIEW_H / 2 + player.height / 2;
            updateCameraView();

            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function handleCollisions(axis) {
            const pBox = getAABB(player.x, player.y, player.width, player.height);
            
            const minCol = Math.floor(player.x / TILE_SIZE);
            const maxCol = Math.floor((player.x + player.width) / TILE_SIZE);
            const minRow = Math.floor(player.y / TILE_SIZE);
            const maxRow = Math.floor((player.y + player.height) / TILE_SIZE);

            for (let c = minCol; c <= maxCol; c++) {
                for (let r = minRow; r <= maxRow; r++) {
                    const tile = levelData[`${c},${r}`];
                    if (!tile) continue;

                    let tBox = getAABB(tile.x, tile.y, TILE_SIZE, TILE_SIZE);
                    
                    if (tile.type === 'spike') {
                        tBox = getAABB(tile.x + 8, tile.y + 20, TILE_SIZE - 16, TILE_SIZE - 20);
                        if (checkCollision(pBox, tBox)) {
                            resetPlayer();
                            return;
                        }
                        continue;
                    }

                    if (checkCollision(pBox, tBox)) {
                        if (axis === 'x') {
                            if (player.vx > 0) {
                                player.x = tile.x - player.width;
                            } else if (player.vx < 0) {
                                player.x = tile.x + TILE_SIZE;
                            }
                            player.vx = 0;
                        } else if (axis === 'y') {
                            if (player.vy > 0) {
                                player.y = tile.y - player.height;
                                player.grounded = true;
                            } else if (player.vy < 0) {
                                player.y = tile.y + TILE_SIZE;
                            }
                            player.vy = 0;
                        }
                    }
                }
            }
        }

        initGrid();
        
        const initialGroundY = 12;
        for (let i = 0; i < 50; i++) {
            const key = `${i},${initialGroundY}`;
            const g = document.createElementNS(svgNS, "g");
            g.setAttribute("transform", `translate(${i * TILE_SIZE}, ${initialGroundY * TILE_SIZE})`);
            g.innerHTML = tileDefs['grass'];
            tilesGroup.appendChild(g);
            levelData[key] = { type: 'grass', x: i * TILE_SIZE, y: initialGroundY * TILE_SIZE, element: g };
            
            for(let j = initialGroundY + 1; j < initialGroundY + 5; j++) {
                const keyDirt = `${i},${j}`;
                const gDirt = document.createElementNS(svgNS, "g");
                gDirt.setAttribute("transform", `translate(${i * TILE_SIZE}, ${j * TILE_SIZE})`);
                gDirt.innerHTML = tileDefs['dirt'];
                tilesGroup.appendChild(gDirt);
                levelData[keyDirt] = { type: 'dirt', x: i * TILE_SIZE, y: j * TILE_SIZE, element: gDirt };
            }
        }
        
        updateCameraView();
    </script>
</body>
</html>
